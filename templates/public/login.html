<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accedi</title>
  <style>
    :root { color-scheme: dark; --bg:#141216; --card:#1d1a20; --line:#332e38; --text:#f3eef5; --muted:#a89fae; --accent:#b85b65; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
           color:var(--text); font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; padding:24px; }
    form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line);
           border-radius:16px; padding:28px; display:grid; gap:14px; }
    h1 { margin:0 0 4px; font-size:22px; }
    p { margin:0; color:var(--muted); font-size:14px; }
    label { font-size:13px; color:var(--muted); }
    input { width:100%; margin-top:6px; padding:11px 12px; border-radius:10px;
            border:1px solid var(--line); background:#151217; color:var(--text); font:inherit; }
    input:focus { outline:2px solid color-mix(in srgb, var(--accent) 60%, transparent); border-color:var(--accent); }
    button { margin-top:4px; padding:12px; border:0; border-radius:10px; background:var(--accent);
             color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    [role="alert"] { min-height:20px; color:#f1a3ab; font-size:13px; }
  </style>
</head>
<body>
  <form id="login">
    <h1>Accedi</h1>
    <p>Inserisci la password condivisa.</p>
    <label for="password">Password
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    </label>
    <button type="submit">Entra</button>
    <p role="alert" id="error"></p>
  </form>
  <script>
    const form = document.getElementById('login')
    const error = document.getElementById('error')
    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      error.textContent = ''
      const password = document.getElementById('password').value
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        })
        if (response.ok) {
          location.href = '/'
          return
        }
        error.textContent = 'Password errata'
      } catch {
        error.textContent = 'Errore di rete, riprova'
      }
    })
  </script>
</body>
</html>
