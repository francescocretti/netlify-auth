<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    :root { color-scheme: dark; --bg:#141216; --card:#1d1a20; --line:#332e38; --text:#f3eef5; --muted:#a89fae; --accent:#b85b65; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
           color:var(--text); font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; padding:24px; }
    form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line);
           border-radius:16px; padding:28px; display:grid; gap:14px; }
    h1 { margin:0 0 4px; font-size:22px; }
    p { margin:0; color:var(--muted); font-size:14px; }
    label { font-size:13px; color:var(--muted); }
    input { width:100%; margin-top:6px; padding:11px 12px; border-radius:10px;
            border:1px solid var(--line); background:#151217; color:var(--text); font:inherit; }
    input:focus { outline:2px solid color-mix(in srgb, var(--accent) 60%, transparent); border-color:var(--accent); }
    .field { position:relative; display:block; margin-top:6px; }
    .field input { margin-top:0; padding-right:48px; }
    .toggle { position:absolute; right:6px; top:50%; transform:translateY(-50%); margin:0; padding:0;
              width:34px; height:34px; display:grid; place-items:center; border-radius:8px;
              background:transparent; color:var(--muted); }
    .toggle:hover { color:var(--text); }
    .toggle[aria-pressed="false"] .eye-off, .toggle[aria-pressed="true"] .eye { display:none; }
    button { margin-top:4px; padding:12px; border:0; border-radius:10px; background:var(--accent);
             color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    [role="alert"] { min-height:20px; color:#f1a3ab; font-size:13px; }
  </style>
</head>
<body>
  <form id="login">
    <h1>Sign in</h1>
    <p>Enter the shared password.</p>
    <label for="password">Password
      <span class="field">
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="eye"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="eye-off"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m1 1 22 22"/></svg>
        </button>
      </span>
    </label>
    <button type="submit">Continue</button>
    <p role="alert" id="error"></p>
  </form>
  <script>
    const form = document.getElementById('login')
    const error = document.getElementById('error')
    const button = form.querySelector('button[type="submit"]')
    const input = document.getElementById('password')
    const toggle = document.getElementById('toggle')
    toggle.addEventListener('click', () => {
      const show = input.type === 'password'
      input.type = show ? 'text' : 'password'
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password')
      toggle.setAttribute('aria-pressed', String(show))
    })
    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      error.textContent = ''
      button.disabled = true
      const password = document.getElementById('password').value
      try {
        const response = await fetch('/.netlify/functions/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        })
        if (response.ok) {
          location.href = '/'
          return
        }
        error.textContent = 'Incorrect password'
      } catch {
        error.textContent = 'Network error. Please try again.'
      } finally {
        button.disabled = false
      }
    })
  </script>
</body>
</html>
